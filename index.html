<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캡스톤디자인 진행판</title>
<!-- fixorder.js 는 붙이지 않습니다 — 이 도구에는 무작위로 뽑는 문항이 없습니다. -->
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 96px}

  header{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  .star{color:#b45309;font-weight:900}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;color:var(--tx)}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .progress{height:9px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}

  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}
  .pill.ms{background:#ede9fe;color:#5b21b6}
  .pill.wk{background:#e0f2fe;color:#075985}
  .pill.dn{background:#dcfce7;color:#166534}
  .muted{color:var(--dim);font-size:13px}
  .score{font-size:32px;font-weight:900;letter-spacing:-1px}

  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#f3f5f8;font-weight:700;color:#38414d}
  .tblwrap{overflow-x:auto}

  input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);
        border-radius:8px;padding:8px 10px;font:14px/1.5 inherit;background:#fff;color:var(--tx)}
  textarea{resize:vertical;min-height:54px}
  label.fld{display:block;margin:9px 0 0}
  label.fld > span{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:3px}

  .out{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:10px;
       padding:9px 11px;margin-bottom:7px;cursor:pointer;background:#fff}
  .out:hover{border-color:var(--pri)}
  .out.on{border-color:var(--ok);background:#f2fbf6}
  .out input{margin:3px 0 0;width:17px;height:17px;flex:0 0 auto;accent-color:#12a150}
  .out .t{font-weight:700}

  .sess{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .sess.done{border-color:#a7e3c2}
  .sesshd{display:flex;gap:10px;align-items:center;padding:13px 15px;cursor:pointer}
  .sesshd .no{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:#eef4ff;color:#1d4ed8;
              font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}
  .sess.done .sesshd .no{background:#dcfce7;color:#166534}
  .sesshd .ti{flex:1 1 auto;min-width:0}
  .sesshd .ti b{display:block;font-size:15px;line-height:1.4}
  .sesshd .ar{flex:0 0 auto;color:var(--dim);font-size:13px}
  .sessbd{padding:2px 15px 15px;border-top:1px dashed var(--line)}

  .step{border-left:3px solid #dfe3ea;padding:2px 0 2px 11px;margin:10px 0}
  .step .sh{font-weight:800;font-size:13.5px;color:#38414d}
  .step ul{margin:3px 0 0;padding-left:17px}
  .step li{margin:2px 0;font-size:14px}
  .step .who{font-size:12px;font-weight:800;color:var(--dim);margin-top:6px}

  .msbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .msbar > div{flex:1 1 132px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px}
  .msbar b{display:block;font-size:13.5px}
  .msbar .pc{font-size:12px;color:var(--dim)}
  .msbar > div.full{border-color:#a7e3c2;background:#f2fbf6}

  .logitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .logitem .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .empty{color:var(--dim);text-align:center;padding:34px 10px}

  .warnbox{background:#fff8e6;border:1px solid #f6d98a;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:14px}
  .okbox{background:#f2fbf6;border:1px solid #a7e3c2;border-radius:10px;padding:10px 13px;margin:10px 0;font-size:14px}

  .rate{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .rate button{flex:1 1 auto;min-width:60px;border:1px solid var(--line);background:#fff;border-radius:8px;
        padding:7px 4px;font-size:13px;font-weight:700;cursor:pointer;color:var(--dim)}
  .rate button.on{background:var(--pri);border-color:var(--pri);color:#fff}

  @media print{
    .tabs,.btn,#rb-btn,.cm-launch,#fxSnd,#bb-btn,.tr-btn,#rk-badge,.noprint{display:none!important}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .card,.sess,.logitem{break-inside:avoid;border-color:#999}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>캡스톤디자인 진행판</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="guide">📋 수업 안내</button>
    <button class="tab"    data-view="board">🗓️ 주차 진행판</button>
    <button class="tab"    data-view="team">🧑‍🤝‍🧑 팀 · 역할</button>
    <button class="tab"    data-view="ailog">🤖 AI 활용 로그</button>
    <button class="tab"    data-view="peer">🎤 발표 상호평가</button>
    <button class="tab"    data-view="score">📊 평가 기준</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   캡스톤디자인 진행판 — 스마트팩토리과 3학년 · 50분 × 15차시 · 3인 팀

   문제를 푸는 도구가 아니라 「프로젝트 진행을 기록하는 도구」입니다.
   내용의 원본은 2026 3학년 프로젝트 수업 지도안 2종입니다.
     · 2번_캡스톤디자인_지도안.docx        → 목표 · 마일스톤 · 역할 · 발표 요건 · 평가 기준
     · 2번_캡스톤디자인_차시별운영안.docx  → 아래 SESSIONS 15차시 전부
   문구는 지도안 표현을 그대로 옮겼습니다. 임의로 바꾸지 마세요.
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md
   ══════════════════════════════════════════════════════════════ */

/* ── 마일스톤 (지도안 Ⅲ) ── */
const MS = [
  { g:'kick', name:'킥오프',       week:'1~3주',
    act:'오리엔테이션 + 재료/장비 파악 + AI로 프로젝트 후보 탐색 + 팀 구성 + 역할 분담',
    out:['팀 구성표','역할 분담표','AI 탐색 로그'] },
  { g:'m1',   name:'M1 주제 확정',  week:'4~5주',
    act:'AI 탐색 결과 바탕으로 팀 논의 → 최종 주제 선정 → 기획서 1쪽 작성 → 주제 발표',
    out:['프로젝트 기획서 (A4 1쪽)','주제 발표 자료'] },
  { g:'m2',   name:'M2 설계 검토',  week:'6~8주',
    act:'회로/기구 설계 → AI로 설계 검토 요청 → 부품 목록 확정 → 설계도 제출',
    out:['설계도 (회로/기구)','부품 목록표'] },
  { g:'m3',   name:'M3 프로토타입', week:'9~11주',
    act:'실제 제작 진행 → 주간 문제해결 세션 → 부분 시연 가능 수준 완성',
    out:['작동 영상 또는 부분 시연','AI 활용 로그 (누적)'] },
  { g:'m4',   name:'M4 비판 검토',  week:'12~13주',
    act:'AI 비판자 역할 부여 → 약점 3가지 이상 도출 → 타당성 판단 → 수정 적용',
    out:['보완 전·후 비교 기록','수정 이력'] },
  { g:'final',name:'최종 발표',     week:'14~16주',
    act:'발표 자료 제작(AI 활용 슬라이드 必 포함) → 리허설 → 최종 발표(팀당 10분) + Q&A',
    out:['발표 자료','AI 활용 포트폴리오'] },
];

/* ── 수업 목표 (지도안 Ⅱ) ── */
const GOALS = [
  '보유 재료·장비를 파악하고 AI와 협력하여 실현 가능한 프로젝트 주제를 선정할 수 있다.',
  '팀 역할을 분담하고 마일스톤별 계획을 수립하여 1학기 동안 프로젝트를 완성할 수 있다.',
  '진행 중 발생하는 기술적·문서적 문제를 AI를 통해 해결하고 그 과정을 기록할 수 있다.',
  '최종 발표에서 결과물과 AI 활용 과정을 함께 설명할 수 있다.',
];

/* ── 주제 탐색 단계 (지도안 Ⅳ) ── */
const EXPLORE = [
  { n:1, t:'재료·장비 목록 작성',
    c:'학교 보유 재료를 팀이 직접 조사하여 목록화. AI에게 ‘이 재료들로 만들 수 있는 스마트팩토리 관련 프로젝트 5가지를 난이도와 함께 알려줘’로 질문.' },
  { n:2, t:'AI 탐색 결과 팀 논의',
    c:'AI 제안 중 ‘실현 가능성 / 흥미도 / 차별성’ 3기준으로 팀 논의. 교사는 현실적 피드백 제공.' },
  { n:3, t:'주제 확정 및 기획서 제출',
    c:'최종 주제 1개 선정 → AI로 기획서 초안 작성 → 팀이 직접 수정 → 교사 승인 후 확정.' },
];

/* ── 역할 분담 가이드 (지도안 Ⅴ) ── */
const ROLES = [
  { key:'기계/하드웨어 담당', job:'기구 설계, 3D 모델링, 조립 및 제작',
    ai:'‘이 구조에서 하중 분산이 될지 계산해줘’, ‘3D 프린팅에 적합한 두께는?’' },
  { key:'전자/코딩 담당',     job:'회로 설계, 아두이노·파이썬 코드 작성 및 디버깅',
    ai:'‘이 센서 코드에서 오류가 나는 이유를 설명해줘’, ‘PID 제어 코드 예시 보여줘’' },
  { key:'문서/발표 담당',     job:'회의록, 기획서, 발표 자료 작성 및 일정 관리',
    ai:'‘회의 메모를 정식 회의록으로 정리해줘’, ‘발표 슬라이드 목차 5장 잡아줘’' },
];

/* ── 최종 발표 필수 슬라이드 (지도안 Ⅵ) ── */
const SLIDES = [
  { n:1, t:'프로젝트 개요',       c:'주제, 선정 이유, 팀원 역할', must:false },
  { n:2, t:'설계 및 제작 과정',   c:'설계도, 주요 제작 단계, 어려웠던 점', must:false },
  { n:3, t:'결과물 시연',         c:'작동 영상 또는 실물 시연', must:false },
  { n:4, t:'AI 활용 과정',        c:'어떤 문제를 AI로 해결했는가 / AI가 틀린 부분은 무엇이었나 / 어떻게 수정했나', must:true },
  { n:5, t:'배운 점 & 개선 방향', c:'팀원 각자의 성장 포인트, 추가 개발 아이디어', must:false },
];

/* ── 평가 기준 (지도안 Ⅶ) — 합계 100점 ── */
const SCORE = [
  { area:'주제 선정 과정 (AI 탐색 포함)', pt:15, std:'AI 탐색 로그가 충실하고, 팀 논의를 거쳐 타당한 주제를 선정했는가', how:'AI 탐색 로그 + 기획서' },
  { area:'마일스톤별 산출물',             pt:30, std:'각 마일스톤 산출물(기획서·설계도·프로토타입·비판검토)을 기한 내 제출했는가', how:'산출물 제출 이력' },
  { area:'제작 완성도',                   pt:25, std:'프로토타입이 설계 의도대로 동작하는가 (부분 동작 시 점수 부여)', how:'최종 시연' },
  { area:'AI 활용 로그',                  pt:15, std:'문제해결 세션 참여 및 AI 활용 과정을 성실하게 기록했는가', how:'AI 활용 로그 (누적)' },
  { area:'최종 발표',                     pt:15, std:'AI 활용 과정 슬라이드 포함, 결과물과 배운 점을 명확하게 발표했는가', how:'발표 평가표' },
];

/* ── 지도 시 유의사항 (지도안 Ⅷ) ── */
const CAUTION = [
  '초반 역할 분담은 1차시 내에 완료. 역할 분담표를 제출하지 않으면 팀 활동 미인정.',
  'AI 탐색 단계에서 ‘재료 목록 → AI 질문 → 팀 논의 → 주제 선정’ 흐름을 반드시 거쳐야 한다. AI가 단독으로 주제를 결정하지 않도록 지도.',
  '마일스톤 산출물은 기한 준수가 원칙. 기한 초과 시 해당 항목 감점 적용.',
  '완성도가 낮은 프로토타입도 ‘과정 기록’이 충실하면 부분 점수 인정. 결과보다 과정 중심 평가 원칙.',
  '발표 시 ‘AI 활용 과정’ 슬라이드 미포함 팀은 발표 점수 최대 30% 감점.',
];

/* ── 발표 상호평가 항목 (14·15차시 동료 평가표) ── */
const PEER = [
  { id:'p1', t:'주제와 목표가 분명한가',                  h:'무엇을 왜 만들었는지 알아들을 수 있었나' },
  { id:'p2', t:'설계·제작 과정을 근거를 들어 설명했는가',  h:'설계도·부품·어려웠던 점이 나왔나' },
  { id:'p3', t:'결과물이 설계 의도대로 동작했는가',        h:'부분 동작도 인정. 무엇이 되고 무엇이 안 됐는지 말했나' },
  { id:'p4', t:'AI 활용 과정을 구체적으로 밝혔는가',       h:'AI가 틀린 부분과 그것을 어떻게 고쳤는지까지 나왔나' },
  { id:'p5', t:'질의응답에 성실하게 답했는가',             h:'모르는 것을 모른다고 말하고 다음 계획을 밝혔나' },
];
const PEER_LV = ['① 아쉬움','② 보통','③ 잘함','④ 매우 잘함'];

/* ── 15차시 (차시별 상세 운영안 전문) ── */
const SESSIONS = [
{ n:1, g:'kick', week:'1주차', ms:'킥오프',
  title:'오리엔테이션 + 팀 구성 + 역할 분담',
  goal:'캡스톤 디자인 수업의 전체 구조와 평가 기준을 이해하고, 3인 팀을 구성하여 역할을 분담할 수 있다.',
  out:['팀 구성표','역할 분담표'],
  steps:[
    { k:'도입', m:'10분',
      t:['캡스톤 디자인 수업 목적·평가 기준·마일스톤 5단계 안내',
         '발표 시 ‘AI 활용 과정’ 슬라이드 필수 포함 강조',
         '3인 팀 구성 기준 안내: 기계·전자·문서 역할 고려'],
      s:['수업 전체 구조 확인','팀 구성 희망 사전 조율'] },
    { k:'전개① 팀 구성', m:'15분',
      t:['3인 팀 구성 진행 (교사 조율)','팀명 선정 안내',

const $  = s => document.querySelector(s);
const el = h => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toISOString().slice(0,10);

const ST = load();
function load(){
  const base = { team:{ name:'', topic:'', members:[ {name:'',role:ROLES[0].key,ai:''},
                                                     {name:'',role:ROLES[1].key,ai:''},
                                                     {name:'',role:ROLES[2].key,ai:''} ] },
                 done:{}, logs:[], peers:[], teacher:{}, open:{} };
  try{ return Object.assign(base, JSON.parse(localStorage.getItem(CFG.storeKey)||'{}')); }
  catch(e){ return base; }
}
function save(){ try{ localStorage.setItem(CFG.storeKey, JSON.stringify(ST)); }catch(e){} }

/* 산출물 체크 상태 — done['3'] = [true,false] */
function outState(s){
  const a = ST.done[s.n] || [];
  return s.out.map((_,i)=>!!a[i]);
}
function outDone(s){ return outState(s).filter(Boolean).length; }
function allOut(){ return SESSIONS.reduce((n,s)=>n+s.out.length,0); }
function allDone(){ return SESSIONS.reduce((n,s)=>n+outDone(s),0); }
function msPct(g){
  const list = SESSIONS.filter(s=>s.g===g);
  const t = list.reduce((n,s)=>n+s.out.length,0);
  const d = list.reduce((n,s)=>n+outDone(s),0);
  return { d, t, pct: t? Math.round(d/t*100) : 0 };
}

/* 마일스톤을 방금 다 채웠으면 한 번만 축하 (게임 요소는 최소로) */
function checkMilestone(g){
  const m = MS.find(x=>x.g===g); if(!m) return;
  const p = msPct(g);
  ST.open = ST.open||{};
  const key = 'ms_'+g;
  if(p.pct===100 && !ST.open[key]){
    ST.open[key]=1; save();
    try{ if(window.FX) FX.banner({ title:m.name+' 완료!', sub:'산출물 '+p.t+'개를 모두 채웠습니다', stars:3 }); }catch(e){}
    try{ if(window.RankKit) RankKit.award(100, '캡스톤디자인 — '+m.name+' 산출물'); }catch(e){}
  }
  if(p.pct<100 && ST.open[key]){ delete ST.open[key]; save(); }
}

function renderBoard(v){
  const d = allDone(), t = allOut();
  v.appendChild(el('<div class="card"><h3>전체 진행</h3>'
    + '<div class="progress"><i style="width:'+(t?d/t*100:0)+'%"></i></div>'
    + '<div class="muted">산출물 '+t+'개 중 <b>'+d+'개</b> 완료 · 15차시</div></div>'));

  const bar = el('<div class="msbar"></div>');
  MS.forEach(m=>{
    const p = msPct(m.g);
    bar.appendChild(el('<div class="'+(p.pct===100?'full':'')+'"><b>'+esc(m.name)+'</b>'
      + '<div class="progress" style="margin:5px 0 3px"><i style="width:'+p.pct+'%"></i></div>'
      + '<div class="pc">'+p.d+' / '+p.t+' 산출물</div></div>'));
  });
  v.appendChild(bar);

  SESSIONS.forEach(s=>v.appendChild(sessCard(s)));
}

function sessCard(s){
  const st = outState(s), dn = st.filter(Boolean).length;
  const opened = !!(ST.open && ST.open['s'+s.n]);
  const box = el('<div class="sess'+(dn===s.out.length?' done':'')+'"></div>');

  const hd = el('<div class="sesshd">'
    + '<div class="no">'+s.n+'차시</div>'
    + '<div class="ti"><b>'+esc(s.title)+'</b>'
      + '<span class="pill wk">'+esc(s.week)+'</span> '
      + '<span class="pill ms">'+esc(s.ms)+'</span> '
      + '<span class="pill'+(dn===s.out.length?' dn':'')+'">산출물 '+dn+'/'+s.out.length+'</span></div>'
    + '<div class="ar">'+(opened?'▲':'▼')+'</div></div>');
  box.appendChild(hd);
  hd.onclick = ()=>{
    ST.open = ST.open||{};
    if(opened) delete ST.open['s'+s.n]; else ST.open['s'+s.n]=1;
    save(); render('board');
  };
  if(!opened) return box;

  const bd = el('<div class="sessbd"></div>');
  bd.appendChild(el('<div class="okbox"><b>학습목표</b> · '+esc(s.goal)+'</div>'));
  s.steps.forEach(p=>{
    bd.appendChild(el('<div class="step"><div class="sh">'+esc(p.k)+' <span class="pill">'+esc(p.m)+'</span></div>'
      + '<div class="who">교사</div><ul>'+p.t.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'
      + '<div class="who">학생 (3인 팀)</div><ul>'+p.s.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'));
  });

  bd.appendChild(el('<h3 style="margin:16px 0 8px;font-size:15px">이 차시의 산출물</h3>'));
  s.out.forEach((o,i)=>{
    const lab = el('<label class="out'+(st[i]?' on':'')+'"><input type="checkbox"'+(st[i]?' checked':'')
      + '><span class="t">'+esc(o)+'</span></label>');
    lab.querySelector('input').onchange = (e)=>{
      const a = ST.done[s.n] || s.out.map(()=>false);
      a[i] = e.target.checked; ST.done[s.n] = a; save();
      checkMilestone(s.g);
      render('board');
    };
    bd.appendChild(lab);
  });

  bd.appendChild(el('<div id="sub'+s.n+'" style="margin-top:6px"></div>'));
  box.appendChild(bd);
  setTimeout(()=>whenRC(()=>mountSessSubmit(s)), 0);
  return box;
}

function mountSessSubmit(s){
  const anchor = document.getElementById('sub'+s.n);
  if(!anchor || !(window.ResultCollector && ResultCollector.attach)) return;
  const btn = ResultCollector.attach(anchor, ()=>{
    const st = outState(s), dn = st.filter(Boolean).length;
    const miss = s.out.filter((o,i)=>!st[i]);
    return {
      mode : '캡스톤디자인 — '+s.n+'차시 '+s.title,
      score: Math.round(dn/s.out.length*100),
      correct: dn, total: s.out.length,
      wrong: miss.length ? miss.map(o=>'미완료: '+o) : ['빠진 산출물 없음 · 팀 '+(ST.team.name||'(팀명 없음)')],
      durationSec: 0,
      labels: LABELS,
    };
  }, { id:'rcBtn'+s.n, className:'btn btn-primary', mode:'캡스톤디자인 — '+s.n+'차시 '+s.title,
       extra:[s.ms+' 산출물 제출'] });
  if(btn){ btn.style.width='100%'; btn.textContent = '📤 ['+s.n+'차시] 산출물 제출'; }
}

/* 시트 열 이름 — 문제풀이 도구가 아니라 기록 도구라서 용어를 바꾼다.
   (Code.gs 가 탭을 처음 만들 때 이 이름으로 열을 만든다) */
const LABELS = { score:'충실도(%)', correct:'작성한 항목', total:'필요 항목',
                 rate:'작성률(%)', wrong:'기록 요약 · 빠진 항목' };

function fld(label, type, val, on){
  const w = el('<label class="fld"><span>'+esc(label)+'</span><input type="'+type+'" value="'+esc(val||'')+'"></label>');
  w.querySelector('input').oninput = e=>on(e.target.value);   /* 입력 중에는 trim 하지 않는다 (공백을 못 치게 됨) */
  return w;
}

/* collector.js 는 </body> 앞에서 늦게 실행된다 — 아직이면 잠깐 뒤에 다시 시도한다 */
function whenRC(fn, tries){
  if(window.ResultCollector && ResultCollector.attach) return fn();
  if((tries||0) > 40) return;
  setTimeout(()=>whenRC(fn,(tries||0)+1), 120);
}
function teamRate(){
  let need = 2, ok = 0;                       // 팀명 · 주제
  const f = x => !!(x||'').trim();
  if(f(ST.team.name)) ok++;
  if(f(ST.team.topic)) ok++;
  ST.team.members.forEach(m=>{ need += 2; if(f(m.name)) ok++; if(f(m.ai)) ok++; });
  return { ok, need, pct: Math.round(ok/need*100) };
}
function paintTeamRate(){
  const r = teamRate();
  const bar = document.getElementById('tmBar'), tx = document.getElementById('tmTx');
  if(bar) bar.style.width = r.pct+'%';
  if(tx)  tx.textContent = '칸 '+r.need+'개 중 '+r.ok+'개 작성';
}
function mountTeamSubmit(){
  const anchor = document.getElementById('tmSub');
  if(!anchor || !(window.ResultCollector && ResultCollector.attach)) return;
  const btn = ResultCollector.attach(anchor, ()=>{
    const r = teamRate();
    const f = x => (x||'').trim();
    const miss = [];
    if(!f(ST.team.name)) miss.push('팀명');
    if(!f(ST.team.topic)) miss.push('프로젝트 주제');
    ST.team.members.forEach((m,i)=>{
      if(!f(m.name)) miss.push('팀원'+(i+1)+' 이름');
      if(!f(m.ai))   miss.push('팀원'+(i+1)+' AI 활용 계획');
    });
    const sum = '팀 '+(f(ST.team.name)||'(팀명 없음)')+' · 주제 '+(f(ST.team.topic)||'(미정)')+' / '
      + ST.team.members.filter(m=>f(m.name)).map(m=>f(m.name)+'('+m.role+')').join(', ');
    return {
      mode:'캡스톤디자인 — 팀 구성·역할 분담표',
      score:r.pct, correct:r.ok, total:r.need,
      wrong: [sum].concat(miss.map(x=>'빈 칸: '+x)),
      durationSec:0, labels:LABELS,
    };
  }, { id:'rcBtnTeam', className:'btn btn-primary', mode:'캡스톤디자인 — 팀 구성·역할 분담표',
       extra:['역할 분담과 협업 계획 수립'] });
  if(btn){ btn.style.width='100%'; btn.textContent='📤 [역할 분담표] 제출'; }
}

/* ── 4) AI 활용 로그 ── */
function logRate(){
  const need = Math.max(ST.logs.length, LOG_TARGET) * LOGF.length;
  let ok = 0;
  ST.logs.forEach(g=>LOGF.forEach(f=>{ if((g[f.k]||'').trim()) ok++; }));
  return { ok, need, pct: Math.round(ok/need*100) };
}
function renderLog(v){
  const r = logRate();
  v.appendChild(el('<div class="card"><h3>AI 활용 로그 (누적)</h3>'
    + '<div class="muted">문제를 만날 때마다 한 건씩 씁니다. 12차시 ‘AI 활용 과정’ 슬라이드와 '
    + '15차시 포트폴리오가 <b>이 기록에서 나옵니다.</b> 목표 '+LOG_TARGET+'건 · 한 건에 5칸.</div>'
    + '<div class="progress" style="margin-top:9px"><i style="width:'+r.pct+'%"></i></div>'
    + '<div class="muted">'+ST.logs.length+'건 작성 · 칸 '+r.need+'개 중 '+r.ok+'개 채움</div>'
    + '<div class="row" style="margin-top:10px">'
      + '<button class="btn btn-primary" id="addLog">＋ 로그 한 건 추가</button>'
      + '<button class="btn" onclick="window.print()">🖨 포트폴리오 인쇄</button></div>'
    + '<div id="lgSub"></div></div>'));

  $('#addLog').onclick = ()=>{
    ST.logs.unshift({ date:today(), sess:'', problem:'', prompt:'', answer:'', bad:'', fix:'' });
    save(); render('ailog');
  };

  if(!ST.logs.length){
    v.appendChild(el('<div class="empty">🤖 아직 로그가 없습니다.<br>'
      + '‘＋ 로그 한 건 추가’ 를 눌러 오늘 AI와 해결한 문제를 적어 두세요.</div>'));
  }

  ST.logs.forEach((g,idx)=>{
    const box = el('<div class="logitem"><div class="hd">'
      + '<span class="pill">'+esc(g.date||'')+'</span>'
      + '<button class="btn btn-sm" data-del="'+idx+'">삭제</button></div></div>');
    box.querySelector('[data-del]').onclick = ()=>{
      if(!confirm('이 로그를 지울까요?')) return;
      ST.logs.splice(idx,1); save(); render('ailog');
    };
    const sel = el('<label class="fld"><span>차시</span><select><option value="">— 고르기 —</option>'
      + SESSIONS.map(s=>'<option value="'+s.n+'"'+(String(g.sess)===String(s.n)?' selected':'')+'>'
          + s.n+'차시 · '+esc(s.title)+'</option>').join('') + '</select></label>');
    sel.querySelector('select').onchange = e=>{ g.sess=e.target.value; save(); };
    box.appendChild(sel);

    LOGF.forEach(f=>{
      const w = el('<label class="fld"><span>'+esc(f.t)+'</span><textarea placeholder="'+esc(f.ph)+'">'
        + esc(g[f.k]||'') + '</textarea></label>');
      w.querySelector('textarea').oninput = e=>{ g[f.k]=e.target.value; save(); };
      box.appendChild(w);
    });
    v.appendChild(box);
  });

  whenRC(mountLogSubmit);
}
function mountLogSubmit(){
  const anchor = document.getElementById('lgSub');
  if(!anchor || !(window.ResultCollector && ResultCollector.attach)) return;
  const btn = ResultCollector.attach(anchor, ()=>{
    const r = logRate();
    const topics = ST.logs.slice(0,5).map((g,i)=>(i+1)+'. '+(g.problem||'(문제 미기재)').slice(0,30));
    const miss = [];
    if(ST.logs.length < LOG_TARGET) miss.push('로그 '+(LOG_TARGET-ST.logs.length)+'건 더 필요');
    ST.logs.forEach((g,i)=>{
      const empty = LOGF.filter(f=>!(g[f.k]||'').trim()).map(f=>f.t.slice(0,1));
      if(empty.length) miss.push((i+1)+'번 빈 칸 '+empty.join('·'));
    });
    return {
      mode:'캡스톤디자인 — AI 활용 로그',
      score:r.pct, correct:r.ok, total:r.need,
      wrong: topics.concat(miss),
      durationSec:0, labels:LABELS,
    };
  }, { id:'rcBtnLog', className:'btn btn-primary', mode:'캡스톤디자인 — AI 활용 로그',
       extra:['AI 활용 과정 기록'] });
  if(btn){ btn.style.width='100%'; btn.textContent='📤 [AI 활용 로그] 제출'; }
}

  v.appendChild(t);

  const sbox = el('<div class="card"><h3>작성 상태</h3>'
    + '<div class="progress"><i id="prBar" style="width:0"></i></div>'
    + '<div class="muted" id="prTx"></div><div id="prSub"></div>'
    + '<div class="row" style="margin-top:10px">'
      + '<button class="btn" id="peerNext">✔ 이 팀 평가 끝 — 다음 팀 적기</button></div></div>');
  v.appendChild(sbox);
  sbox.querySelector('#peerNext').onclick = ()=>{
    const nm = (peerCur.team||'').trim();
    if(!nm){ alert('발표한 팀 이름을 먼저 적어 주세요.'); return; }
    if(!confirm('‘'+nm+'’ 평가를 마치고 화면을 비울까요? (제출은 위 버튼으로 따로 해야 선생님께 갑니다)')) return;
    ST.peers.unshift({ date:today(), team:nm });
    ST.peers = ST.peers.slice(0,20); save();
    peerCur = { team:'', sc:{}, good:'', adv:'' };
    render('peer');
  };

  if(ST.peers.length){
    v.appendChild(el('<div class="card"><h3>이 기기에서 적은 팀</h3>'
      + ST.peers.map(p=>'<div class="muted">· '+esc(p.date)+' — '+esc(p.team)+'</div>').join('')+'</div>'));
  }

  paintPeer();
  whenRC(mountPeerSubmit);
}
function peerRate(){
  const need = 1 + PEER.length + 2;
  let ok = 0;
  if((peerCur.team||'').trim()) ok++;
  PEER.forEach(p=>{ if(peerCur.sc[p.id]) ok++; });
  if((peerCur.good||'').trim()) ok++;
  if((peerCur.adv||'').trim()) ok++;
  return { ok, need, pct: Math.round(ok/need*100) };
}
function paintPeer(){
  const r = peerRate();
  const bar = document.getElementById('prBar'), tx = document.getElementById('prTx');
  if(bar) bar.style.width = r.pct+'%';
  if(tx)  tx.textContent = '칸 '+r.need+'개 중 '+r.ok+'개 작성 — 다 채워야 제출이 의미 있습니다';
}
function mountPeerSubmit(){
  const anchor = document.getElementById('prSub');
  if(!anchor || !(window.ResultCollector && ResultCollector.attach)) return;
  const btn = ResultCollector.attach(anchor, ()=>{
    const r = peerRate();
    const detail = PEER.map((p,i)=>(i+1)+'. '+p.t.slice(0,12)+' '
      + (peerCur.sc[p.id] ? PEER_LV[peerCur.sc[p.id]-1] : '미평가'));
    const lines = ['평가한 팀: '+(peerCur.team||'(미기재)')]
      .concat(detail)
      .concat(['좋았던 점: '+(peerCur.good||'(미기재)'), '질문·조언: '+(peerCur.adv||'(미기재)')]);
    return {
      mode:'캡스톤디자인 — 발표 상호평가',
      score:r.pct, correct:r.ok, total:r.need,
      wrong: lines, durationSec:0, labels:LABELS,
    };
  }, { id:'rcBtnPeer', className:'btn btn-primary', mode:'캡스톤디자인 — 발표 상호평가',
       extra:['동료 발표 상호평가 참여'] });
  if(btn){ btn.style.width='100%'; btn.textContent='📤 [상호평가] 이 팀 평가 제출'; }
}

/* ── 6) 평가 기준 (배점표 + 교사 채점) ── */
function renderScore(v){
  v.appendChild(el('<div class="card"><h3>평가 기준 — 합계 100점</h3>'
    + '<div class="muted" style="margin-bottom:8px">지도안 Ⅶ 그대로입니다. 학생도 처음부터 볼 수 있어야 하는 표입니다.</div>'
    + '<div class="tblwrap"><table><tr><th style="width:150px">평가 영역</th><th style="width:52px">배점</th>'
    + '<th>평가 기준</th><th style="width:120px">평가 방법</th></tr>'
    + SCORE.map(s=>'<tr><td><b>'+esc(s.area)+'</b></td><td>'+s.pt+'점</td><td>'+esc(s.std)+'</td>'
        + '<td class="muted">'+esc(s.how)+'</td></tr>').join('')
    + '<tr><td><b>합계</b></td><td><b>100점</b></td><td colspan="2" class="muted">'
    + '결과보다 <b>과정 중심</b> 평가 — 완성도가 낮아도 과정 기록이 충실하면 부분 점수를 인정합니다.'
    + '</td></tr></table></div></div>'));

  const c = el('<div class="card"><h3>채점표 (교사용)</h3>'
    + '<div class="muted">이 기기에만 저장됩니다. 인쇄해서 쓰거나 화면 그대로 보여 줘도 됩니다.</div></div>');
  SCORE.forEach((s,i)=>{
    const w = el('<label class="fld"><span>'+esc(s.area)+' (0~'+s.pt+'점)</span>'
      + '<input type="number" min="0" max="'+s.pt+'" value="'+(ST.teacher['t'+i]==null?'':ST.teacher['t'+i])+'"></label>');
    w.querySelector('input').oninput = e=>{
      let n = parseInt(e.target.value,10);
      if(isNaN(n)) { delete ST.teacher['t'+i]; }
      else {
        n = Math.max(0, Math.min(s.pt, n));
        ST.teacher['t'+i] = n;
        if(String(n) !== e.target.value) e.target.value = n;   /* 배점을 넘겨 적으면 화면도 함께 되돌린다 */
      }
      save(); paintTotal();
    };
    c.appendChild(w);
  });
  c.appendChild(el('<div class="okbox" style="margin-top:12px"><b>합계</b> <span class="score" id="tot">0</span> / 100점</div>'));
  c.appendChild(el('<div class="row"><button class="btn" onclick="window.print()">🖨 채점표 인쇄</button></div>'));
  v.appendChild(c);

  v.appendChild(el('<div class="card"><h3>세부능력 및 특기사항은 무엇으로 쓰나</h3>'
    + '<div class="body">이 도구가 제출한 기록은 <span class="kw">rubric.json</span> 의 평가요소로 수준(상·중·하)을 판정해 '
    + '선생님 시트에 문장 초안까지 함께 남깁니다. 왼쪽 아래 <b>📋 평가 기준</b> 버튼을 누르면 '
    + '무엇을 어떤 기준으로 보는지 학생도 그대로 볼 수 있습니다.</div>'
    + '<div class="muted" style="margin-top:8px">문장 초안은 어디까지나 초안입니다. '
    + '실제 기재는 수업에서 관찰한 사실로 교사가 확인해 씁니다.</div></div>'));

  paintTotal();
}
function paintTotal(){
  const t = SCORE.reduce((n,s,i)=>n + (ST.teacher['t'+i]||0), 0);
  const e = document.getElementById('tot');
  if(e) e.textContent = t;
}

/* ── 계급 배지 (오른쪽 아래, 수업모드·소리 위로 쌓임) ── */
function stackBadge(el2){
  function place(){
    var up = 10;
    ['.cm-launch','#fxSnd'].forEach(function(s){
      var o = document.querySelector(s); if(!o) return;
      var r = o.getBoundingClientRect();
      if(r.height) up = Math.max(up, Math.round(window.innerHeight - r.top) + 6);
    });
    el2.style.bottom = up + 'px';
  }
  place(); setTimeout(place,0);
  window.addEventListener('load', place);
  window.addEventListener('resize', place);
}
function paintBadge(){
  if(!window.Rank || !document.body) return;
  var e = document.getElementById('rk-badge');
  if(!e){
    e = document.createElement('div'); e.id='rk-badge';
    e.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9998;'
      + 'font-size:11.5px;opacity:.9;pointer-events:none';
    document.body.appendChild(e);
    stackBadge(e);
  }
  try{ e.innerHTML = Rank.badge(); }catch(err){}
}
window.RankKit = {
  award: function(pct, mode){
    if(!window.Rank) return null;
    var rk = null;
    try{ rk = Rank.award(pct, { mode: mode || '캡스톤디자인' }); }catch(e){}
    paintBadge();
    if(rk && rk.tierUp && window.FX){
      try{ FX.banner({ icon:rk.tierAfter.icon, title:rk.tierAfter.name+' 승급!',
                       sub:rk.after+' RP · '+rk.tierAfter.full, stars:3 }); }catch(e){}
    }
    return rk;
  }
};

$('#hdSub').textContent = '스마트팩토리과 3학년 · 50분 × 15차시 · 3인 팀';
render('guide');
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', paintBadge);
else setTimeout(paintBadge, 300);
</script>
